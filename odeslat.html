<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Odeslat pozvánku · Radio Awards 2026</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08070a;color:#f4ecdc;font:500 17px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
a{display:inline-block;margin-top:18px;padding:16px 26px;border-radius:14px;background:#d9b46a;color:#171208;font-weight:700;text-decoration:none}
p{color:#bdb4a2;font-size:14px;max-width:340px}
</style></head><body><div>
<div>Otevírám zprávu…</div>
<a id="go" href="#">Otevřít zprávu</a>
<p>Kdyby se zpráva neotevřela sama, klepněte na tlačítko. Údaje jsou jen v tomto odkazu, nikam se neposílají.</p>
</div>
<script>
// Přesměrování z řídicí tabulky na SMS / e-mail (Tabulky Google neumí odkazy sms: a mailto: přímo).
// Údaje jsou v části za # → prohlížeč je neposílá na server.
const p=new URLSearchParams(location.hash.slice(1)), to=p.get('to')||'', body=p.get('b')||'', subj=p.get('s')||'';
const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
let url='';
if(p.get('k')==='sms') url='sms:'+to+(ios?'&':'?')+'body='+encodeURIComponent(body);
if(p.get('k')==='mail') url='mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
document.getElementById('go').href=url||'#';
if(url) location.href=url;
</script></body></html>
